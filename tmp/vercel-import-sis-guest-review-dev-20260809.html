<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://uwgkwyxjuikqxsezkezj.supabase.co; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>SIS Airbnb Guest Communication Agent DEV · Review</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#18181b; background:#f4f4f5; color-scheme:light }
    *{box-sizing:border-box} body{margin:0;min-height:100vh} button,input,textarea{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.55}
    .shell{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}.eyebrow{margin:0 0 4px;color:#71717a;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}h1{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.15}.subtitle{margin:8px 0 0;color:#52525b}.safety{margin:20px 0;padding:14px 16px;border:2px solid #dc2626;background:#fff1f2;border-radius:12px;color:#991b1b;font-weight:800;letter-spacing:.03em}.auth{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:14px;min-width:min(100%,360px)}.auth label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.auth-row{display:flex;gap:8px}input,textarea{border:1px solid #d4d4d8;border-radius:9px;padding:10px 11px;background:#fff;color:#18181b}input:focus,textarea:focus{outline:2px solid #a1a1aa;outline-offset:1px}.auth input{flex:1;min-width:0}.helper{margin-top:7px;font-size:12px;color:#71717a}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 10px}.tab,.button{border:1px solid #d4d4d8;background:#fff;border-radius:9px;padding:9px 12px;color:#18181b}.tab.active{background:#18181b;color:#fff;border-color:#18181b;font-weight:700}.button.primary{background:#18181b;color:#fff;border-color:#18181b}.button.reject{color:#b91c1c;border-color:#fecaca;background:#fff}.button.ghost{background:transparent}.statusbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:34px;color:#52525b;font-size:14px;margin-bottom:12px}.api-state{display:inline-flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:999px;background:#a1a1aa}.dot.ok{background:#16a34a}.dot.bad{background:#dc2626}.grid{display:grid;gap:16px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.card-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.identity{min-width:0}.guest{font-size:18px;font-weight:800;margin:0}.property{color:#52525b;margin-top:3px}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#f4f4f5;color:#3f3f46;font-size:12px;font-weight:650}.question{margin:16px 0 8px;font-size:17px;font-weight:750;line-height:1.45}.small{color:#71717a;font-size:12px;overflow-wrap:anywhere}.section-title{margin:16px 0 7px;font-size:12px;font-weight:800;color:#52525b;text-transform:uppercase;letter-spacing:.05em}.facts{display:grid;gap:7px}.fact{background:#fafafa;border:1px solid #eeeeef;border-radius:9px;padding:9px 10px;line-height:1.4;overflow-wrap:anywhere}.fact-key{display:block;font-size:11px;font-weight:800;color:#71717a;margin-bottom:3px}.editor{width:100%;min-height:160px;resize:vertical;line-height:1.5}.review-fields{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:8px;margin-top:10px}.review-fields input{width:100%}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}.history{margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f1;color:#52525b;font-size:13px}.empty{background:#fff;border:1px dashed #d4d4d8;border-radius:13px;padding:34px 18px;text-align:center;color:#71717a}.notice{border-radius:10px;padding:10px 12px;margin:8px 0 14px;display:none}.notice.show{display:block}.notice.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.notice.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}@media(max-width:700px){.shell{padding:14px}.auth{width:100%}.review-fields{grid-template-columns:1fr}.actions .button{flex:1}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div><p class="eyebrow">SIS · Internal DEV</p><h1>Guest Communication Review</h1><p class="subtitle">Entwürfe prüfen, editieren und als Review-Entscheidung speichern.</p></div><section class="auth" aria-label="API-Zugang"><label for="key">SIS DEV API-Key</label><div class="auth-row"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="X-SIS-Intake-Key"><button id="useKey" class="button primary" type="button">Verwenden</button><button id="forgetKey" class="button ghost" type="button">Löschen</button></div><div class="helper">Nur in <code>sessionStorage</code>; nicht im Frontend-Code, nicht persistent.</div></section></div>
    <div class="safety">REVIEW ONLY · NO SEND</div>
    <div class="toolbar" role="tablist" aria-label="Review-Status"><button class="tab active" type="button" data-status="pending">Pending</button><button class="tab" type="button" data-status="approved">Approved</button><button class="tab" type="button" data-status="rejected">Rejected</button><button id="refresh" class="button" type="button">Neu laden</button></div>
    <div class="statusbar"><span id="status">DEV API-Key eingeben.</span><span class="api-state"><span id="healthDot" class="dot"></span><span id="healthText">API wird geprüft …</span></span></div><div id="notice" class="notice" role="alert"></div><div id="grid" class="grid"></div>
  </main>
  <script>
    'use strict';
    const API_BASE='https://uwgkwyxjuikqxsezkezj.supabase.co/functions/v1/sis-guest-communication-review-dev';
    const KEY_STORAGE='sis_guest_review_key';
    const state={status:'pending',key:sessionStorage.getItem(KEY_STORAGE)||'',busy:false};
    const keyEl=document.getElementById('key'),statusEl=document.getElementById('status'),gridEl=document.getElementById('grid'),noticeEl=document.getElementById('notice'),healthDot=document.getElementById('healthDot'),healthText=document.getElementById('healthText');keyEl.value=state.key;
    function text(value,fallback='—'){if(value===null||value===undefined||value==='')return fallback;return String(value)}
    function setStatus(message){statusEl.textContent=message}
    function showNotice(kind,message){noticeEl.className='notice show '+kind;noticeEl.textContent=message}
    function clearNotice(){noticeEl.className='notice';noticeEl.textContent=''}
    function element(tag,className,content){const node=document.createElement(tag);if(className)node.className=className;if(content!==undefined)node.textContent=content;return node}
    function pill(label){return element('span','pill',label)}
    function authHeaders(withJson=false){const headers={'X-SIS-Intake-Key':state.key};if(withJson)headers['Content-Type']='application/json';return headers}
    async function api(path,options={}){const response=await fetch(API_BASE+path,{...options,headers:{...authHeaders(Boolean(options.body)),...(options.headers||{})},cache:'no-store'});const body=await response.json().catch(()=>({error:'INVALID_JSON_RESPONSE'}));if(!response.ok){const err=new Error(body.detail||body.error||('HTTP_'+response.status));err.status=response.status;throw err}return body}
    function normalizeFacts(value){if(Array.isArray(value))return value;if(value&&typeof value==='object')return Object.entries(value).map(([fact_key,fact_value])=>({fact_key,fact_value}));return []}
    function reviewId(review){return review.review_id||review.id||''}
    function draftText(review){return review.final_reply||review.draft_reply_snapshot||review.draft_reply||''}
    async function decide(review,action,finalReply,reviewedBy,note){const id=reviewId(review);if(!id)throw new Error('REVIEW_ID_MISSING');if(!reviewedBy.trim())throw new Error('Reviewed by ist erforderlich.');const payload=action==='approve'?{action:'approve',final_reply:finalReply,reviewed_by:reviewedBy.trim(),note:note.trim()}:{action:'reject',reviewed_by:reviewedBy.trim(),note:note.trim()};if(action==='approve'&&!finalReply.trim())throw new Error('Finaler Draft darf nicht leer sein.');const result=await api('/v1/reviews/'+encodeURIComponent(id)+'/decision',{method:'POST',body:JSON.stringify(payload)});if(action==='approve'&&(result.mail_write_allowed!==false||result.send_performed!==false))throw new Error('SAFETY_GUARD_FAILED: Approval-Antwort bestätigt NO SEND nicht ausdrücklich.');return result}
    function renderFacts(review,card){const facts=normalizeFacts(review.facts_used);card.append(element('div','section-title','Verwendete Fakten'));if(!facts.length){card.append(element('div','small','Keine Fakten angegeben.'));return}const factsEl=element('div','facts');for(const fact of facts){const box=element('div','fact');box.append(element('span','fact-key',text(fact.fact_key||fact.key,'Fact')));const value=fact.fact_value??fact.value??fact;box.append(document.createTextNode(typeof value==='string'?value:JSON.stringify(value)));factsEl.append(box)}card.append(factsEl)}
    function renderReviews(reviews){gridEl.replaceChildren();if(!reviews.length){gridEl.append(element('div','empty','Keine Reviews in diesem Status.'));return}for(const review of reviews){const card=element('article','card'),head=element('div','card-head'),identity=element('div','identity');identity.append(element('p','guest',text(review.guest_name,'Gast unbekannt')));identity.append(element('div','property',text(review.property_title||review.property_name,'Unterkunft unbekannt')));head.append(identity);const meta=element('div','meta');meta.append(pill(text(review.intent,'Intent n/a')),pill('Risk: '+text(review.risk_level,'n/a')),pill(text(review.status,state.status)));head.append(meta);card.append(head);card.append(element('div','section-title','Frage / Zusammenfassung'));card.append(element('div','question',text(review.question_summary||review.summary,'Keine Zusammenfassung.')));if(review.source_message_id)card.append(element('div','small','Source message: '+review.source_message_id));renderFacts(review,card);card.append(element('div','section-title','Draft'));const editor=element('textarea','editor');editor.value=draftText(review);editor.disabled=review.status!=='pending';editor.setAttribute('aria-label','Antwortentwurf');card.append(editor);if(review.status==='pending'){const fields=element('div','review-fields'),reviewedBy=element('input'),note=element('input');reviewedBy.type='text';reviewedBy.placeholder='Reviewed by';reviewedBy.autocomplete='off';note.type='text';note.placeholder='Interne Review-Notiz (optional)';note.autocomplete='off';fields.append(reviewedBy,note);card.append(fields);const actions=element('div','actions'),reject=element('button','button reject','Ablehnen'),approve=element('button','button primary','Freigeben');reject.type=approve.type='button';async function runDecision(action){if(state.busy)return;clearNotice();state.busy=true;approve.disabled=reject.disabled=true;try{setStatus(action==='approve'?'Freigabe wird gespeichert …':'Ablehnung wird gespeichert …');await decide(review,action,editor.value,reviewedBy.value,note.value);showNotice('success',action==='approve'?'Freigegeben. Sicherheitsbestätigung: mail_write_allowed=false · send_performed=false.':'Abgelehnt. Es wurde keine Gastaktion ausgelöst.');await loadReviews({preserveNotice:true})}catch(error){showNotice('error','Fehler: '+error.message);setStatus('Decision nicht als erfolgreich akzeptiert.')}finally{state.busy=false;approve.disabled=reject.disabled=false}}approve.addEventListener('click',()=>runDecision('approve'));reject.addEventListener('click',()=>runDecision('reject'));actions.append(reject,approve);card.append(actions)}else{const history=element('div','history');const pieces=['Reviewed by: '+text(review.reviewed_by),review.reviewed_at?new Date(review.reviewed_at).toLocaleString('de-DE'):null,review.review_note||review.note||null].filter(Boolean);history.textContent=pieces.join(' · ');card.append(history)}gridEl.append(card)}}
    async function loadReviews({preserveNotice=false}={}){if(!preserveNotice)clearNotice();if(!state.key){gridEl.replaceChildren();setStatus('DEV API-Key eingeben.');return}setStatus('Lade '+state.status+' Reviews …');try{const result=await api('/v1/reviews?status='+encodeURIComponent(state.status)+'&limit=50');if(result.mail_write_allowed!==false)throw new Error('SAFETY_GUARD_FAILED: Review-Liste bestätigt mail_write_allowed=false nicht.');const reviews=Array.isArray(result.reviews)?result.reviews:[];renderReviews(reviews);setStatus(reviews.length+' Review(s) · REVIEW ONLY · NO SEND')}catch(error){gridEl.replaceChildren();showNotice('error',error.status===401?'Unauthorized: API-Key prüfen.':error.message);setStatus('Reviews konnten nicht geladen werden.')}}
    async function checkHealth(){try{const response=await fetch(API_BASE+'/health',{cache:'no-store'}),body=await response.json(),safe=response.ok&&body.mail_write_allowed===false&&body.send_endpoint_present===false;healthDot.className='dot '+(safe?'ok':'bad');healthText.textContent=safe?'API ready · NO SEND bestätigt':'API-Sicherheitsstatus unerwartet'}catch{healthDot.className='dot bad';healthText.textContent='API nicht erreichbar'}}
    document.getElementById('useKey').addEventListener('click',()=>{state.key=keyEl.value.trim();if(state.key)sessionStorage.setItem(KEY_STORAGE,state.key);else sessionStorage.removeItem(KEY_STORAGE);loadReviews()});
    document.getElementById('forgetKey').addEventListener('click',()=>{state.key='';keyEl.value='';sessionStorage.removeItem(KEY_STORAGE);gridEl.replaceChildren();clearNotice();setStatus('DEV API-Key gelöscht.')});
    document.getElementById('refresh').addEventListener('click',()=>loadReviews());document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(node=>node.classList.remove('active'));button.classList.add('active');state.status=button.dataset.status;loadReviews()}));checkHealth();if(state.key)loadReviews();
  </script>
</body>
</html>
